<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTC Web</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #ddd;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        height: 100vh;
        height: 100dvh;
    }

    #app {
        position: relative;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
    }

    /* ---------------------------------------------------------------------
       Floating sidebar.  Dark semi-transparent, rounded corners, sits over
       the canvas on the left.  Canvas extends behind it.
       --------------------------------------------------------------------- */
    #sidebar {
        position: absolute;
        top: 12px;
        left: 12px;
        bottom: 12px;
        width: 290px;
        background: rgba(20,20,28,0.85);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        backdrop-filter: blur(6px);
        color: #ddd;
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 10;
        gap: 8px;
    }
    body.locked-mode #sidebar { display: none; }
    body.sidebar-hidden #sidebar { display: none; }

    .section { flex: 0 0 auto; }
    .section-header {
        text-align: left;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: #9aa6b2;
        padding: 0 0 4px 2px;
        position: relative;
    }

    /* Tiny collapse arrow in the Map section's header (top-left corner). */
    #collapse-sidebar {
        position: absolute;
        top: -2px;
        left: -4px;
        width: 18px;
        height: 18px;
        padding: 0;
        line-height: 1;
        font-size: 12px;
        font-weight: 700;
        color: #ddd;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 4px;
        cursor: pointer;
    }
    #collapse-sidebar:hover { background: rgba(255,255,255,0.18); }

    .section-header.with-arrow { padding-left: 22px; }

    /* Map section: 2 columns of 7. Fills the available vertical space. */
    .map-section {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }
    .map-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        flex: 1 1 0;
        min-height: 0;
    }
    .map-grid .col {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 0;
    }

    /* Wind direction: 8 buttons in 2 rows of 4, radio behaviour. */
    .wind-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
    }

    /* All clickable buttons inside the sidebar share a base look. */
    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px 6px;
        border: 1px solid #4f7fa6;
        border-radius: 12px;
        background: #4f7fa6;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        cursor: pointer;
        transition: background 80ms ease, transform 60ms ease;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .map-grid .btn { flex: 1 1 0; min-height: 0; }
    .wind-grid .btn { min-height: 26px; }

    .btn:hover { background: #5e93b8; }
    .btn:active { transform: scale(0.98); }
    .btn.active {
        background: #e34a3a;
        border-color: #e34a3a;
    }
    .btn.disabled {
        background: rgba(80,80,90,0.6);
        border-color: rgba(120,120,130,0.4);
        cursor: not-allowed;
        color: rgba(255,255,255,0.5);
    }

    /* ---------- Radio-style rows (Wind strength, Prestart time) ---------- */
    .radio-panel {
        padding: 6px 8px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 6px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .radio-panel .label {
        flex: 0 0 auto;
        font-size: 10px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        font-weight: 700;
        color: #9aa6b2;
    }
    .radio-buttons {
        display: flex;
        gap: 4px;
        flex: 1 1 0;
        justify-content: flex-end;
    }
    .radio-btn {
        min-width: 26px;
        padding: 4px 4px;
        border: 1px solid #4f7fa6;
        border-radius: 10px;
        background: #4f7fa6;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        line-height: 1;
    }
    .radio-btn:hover { background: #5e93b8; }
    .radio-btn.active {
        background: #e34a3a;
        border-color: #e34a3a;
    }

    /* ---------- Time controls ---------- */
    #time-panel {
        padding: 8px 10px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 6px;
        flex: 0 0 auto;
    }
    .time-row {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
        gap: 8px;
    }
    .time-row:last-child { margin-bottom: 0; }
    .time-row label {
        flex: 0 0 70px;
        font-size: 11px;
        color: #9aa6b2;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .time-row input.time-text {
        flex: 1;
        padding: 4px 6px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 3px;
        background: rgba(0,0,0,0.4);
        color: #fff;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
    }
    .step-row {
        display: flex;
        justify-content: space-between;
        gap: 4px;
        margin-top: 6px;
    }
    .step-btn {
        flex: 1;
        padding: 4px 0;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 3px;
        background: rgba(255,255,255,0.05);
        color: #ddd;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
    }
    .step-btn:hover { background: rgba(255,255,255,0.12); }

    /* ---------- Stage (canvas + slider + overlays) ---------- */
    #stage {
        position: absolute;
        inset: 0;
        background: #000;
        overflow: hidden;
    }
    #map-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        touch-action: none;
    }
    #map-canvas.dragging { cursor: grabbing; }

    /* ---------- Vertical slider with tide markers ---------- */
    #slider-wrap {
        position: absolute;
        top: 14px;
        right: 14px;
        bottom: 14px;
        width: 110px;
        display: none;
        flex-direction: column;
        align-items: stretch;
        background: rgba(20,20,28,0.85);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 8px 6px 8px 10px;
        backdrop-filter: blur(6px);
        z-index: 5;
    }
    #slider-wrap.visible { display: flex; }

    #slider-wrap .slider-title {
        font-size: 10px;
        letter-spacing: 0.6px;
        color: #9aa6b2;
        text-transform: uppercase;
        text-align: right;
        margin: 0 0 2px;
    }
    #slider-wrap .slider-subtitle {
        font-size: 9px;
        color: #6b7785;
        text-align: right;
        margin-bottom: 6px;
    }

    /* The slider body holds the tide-marker labels on the left and the
       native range input on the right, sharing the same vertical extent. */
    .slider-body {
        flex: 1 1 0;
        position: relative;
        display: flex;
        min-height: 0;
    }
    .tide-markers-col {
        flex: 1 1 0;
        position: relative;     /* anchor for absolutely-positioned markers */
        padding-right: 4px;
    }
    .tide-marker {
        position: absolute;
        right: 0;
        transform: translateY(50%);
        text-align: right;
        line-height: 1.05;
        white-space: nowrap;
    }
    .tide-marker .tide-name {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        color: #fff;
        display: block;
    }
    .tide-marker .tide-time {
        font-size: 9px;
        color: #9aa6b2;
        font-variant-numeric: tabular-nums;
        display: block;
    }

    .slider-track-area {
        flex: 0 0 26px;
        display: flex;
        align-items: stretch;
        justify-content: center;
    }
    #vert-slider {
        flex: 1 1 0;
        width: 26px;
        writing-mode: vertical-lr;
        direction: rtl;
        cursor: pointer;
        appearance: slider-vertical;
        margin: 0;
    }

    #vert-slider-readout {
        font-size: 11px;
        color: #fff;
        font-weight: 700;
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
        text-align: right;
    }

    /* ---------- Bottom-left toggles (ALWAYS visible when a map is loaded) ----- */
    #lock-toggles {
        position: absolute;
        bottom: 16px;
        left: 16px;
        display: none;
        gap: 8px;
        z-index: 6;
    }
    #lock-toggles.visible { display: flex; }
    .lock-btn {
        padding: 6px 14px;
        border: 1px solid #4f7fa6;
        border-radius: 14px;
        background: #4f7fa6;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        min-width: 70px;
    }
    .lock-btn:hover { background: #5e93b8; }
    .lock-btn.active {
        background: #e34a3a;
        border-color: #e34a3a;
    }

    /* ---------- Show-sidebar button (when default-mode sidebar collapsed) ---- */
    #expand-sidebar {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(20,20,28,0.85);
        border: 1px solid rgba(255,255,255,0.18);
        color: #fff;
        border-radius: 6px;
        width: 30px;
        height: 30px;
        padding: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        display: none;
        z-index: 11;
    }
    body.sidebar-hidden #expand-sidebar { display: block; }
    body.locked-mode #expand-sidebar { display: none !important; }

    /* ---------- Top-of-canvas HUD + legend overlay ---------- */
    #top-overlay {
        position: absolute;
        top: 14px;
        left: 314px;     /* clear the sidebar on the left */
        display: flex;
        gap: 10px;
        align-items: flex-start;
        z-index: 5;
        pointer-events: none;
    }
    body.locked-mode #top-overlay,
    body.sidebar-hidden #top-overlay { left: 14px; }

    #legend {
        background: rgba(20,20,28,0.85);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 11px;
        color: #eee;
        display: none;
    }
    #legend h4 {
        margin: 0 0 3px;
        font-size: 10px;
        letter-spacing: 0.5px;
        color: #9aa6b2;
        font-weight: 700;
    }
    #legend .group + .group { margin-top: 4px; }
    #legend .row {
        display: flex;
        align-items: center;
        gap: 5px;
        line-height: 1.1;
        margin: 1px 0;
        font-variant-numeric: tabular-nums;
    }
    #legend .swatch {
        width: 12px;
        height: 10px;
        border-radius: 2px;
        flex: 0 0 12px;
        border: 1px solid rgba(255,255,255,0.2);
    }
    #legend .val { color: #fff; }

    #hud {
        background: rgba(20,20,28,0.85);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        color: #eee;
        line-height: 1.35;
        display: none;
    }
    #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        white-space: nowrap;
    }
    #hud .row strong {
        color: #fff;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
    }

    /* ---------- Tidal-phase indicator (left side of canvas, below HUD) ----- */
    #blend-indicator {
        position: absolute;
        top: 14px;
        right: 134px;     /* clear the slider on the right */
        background: rgba(20,20,28,0.85);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        padding: 8px 12px 6px;
        min-width: 180px;
        max-width: 220px;
        color: #fff;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        display: none;
        z-index: 5;
    }
    #blend-indicator .bar {
        position: relative;
        height: 6px;
        background: rgba(255,255,255,0.16);
        border-radius: 3px;
        margin-bottom: 4px;
    }
    #blend-indicator .bar .fill {
        position: absolute;
        top: 0; left: 0; height: 100%;
        background: linear-gradient(90deg, #d18b1a 0%, #f3a829 100%);
        border-radius: 3px;
        transition: width 100ms linear;
    }
    #blend-indicator .pcts {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #ddd;
        margin-bottom: 1px;
    }
    #blend-indicator .lbls {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.7px;
        font-weight: 700;
        color: #f0f0f0;
    }
    #blend-indicator .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f3a829;
        vertical-align: middle;
        margin: 0 4px;
    }

    /* Touch-device crosshair */
    #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 28px;
        height: 28px;
        margin-left: -14px;
        margin-top: -14px;
        pointer-events: none;
        display: none;
        z-index: 4;
    }
    #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255,255,255,0.85);
        box-shadow: 0 0 4px rgba(0,0,0,0.9);
    }
    #crosshair::before { left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; }
    #crosshair::after  { top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; }
    body.touch-mode #crosshair { display: block; }
    body.touch-mode #map-canvas { cursor: default; }

    /* Cursor tooltip */
    #tooltip {
        position: fixed;
        pointer-events: none;
        background: rgba(20,20,28,0.92);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 11px;
        color: #fff;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
        display: none;
        z-index: 50;
        white-space: nowrap;
    }
    #tooltip .lbl { color: #9aa6b2; margin-right: 4px; }

    /* Empty / status messages */
    #empty-msg {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 18px;
        color: #555;
        pointer-events: none;
    }
    #status {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(180, 40, 40, 0.85);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        color: #fff;
        font-family: ui-monospace, Consolas, monospace;
        max-width: 70%;
        text-align: center;
        pointer-events: none;
        display: none;
    }
</style>
</head>
<body>
<div id="app">

    <main id="stage">
        <canvas id="map-canvas"></canvas>

        <!-- Top-of-screen overlay: legend + HUD (Day time / Race time). -->
        <div id="top-overlay">
            <div id="legend"></div>
            <div id="hud">
                <div class="row"><span>Day time</span><strong id="hud-time">--:--:--</strong></div>
                <div class="row"><span>Race time</span><strong id="hud-chrono">+0:00:00</strong></div>
            </div>
        </div>

        <div id="empty-msg">Select a map to begin</div>
        <div id="status"></div>
        <div id="tooltip"></div>
        <div id="crosshair"></div>
        <button id="expand-sidebar" title="Show menu">&#9776;</button>

        <!-- Bottom-left layer toggles (always visible once a map is picked) -->
        <div id="lock-toggles">
            <button class="lock-btn" id="lock-wind-btn">Wind</button>
            <button class="lock-btn" id="lock-current-btn">Current</button>
        </div>

        <!-- Tidal-phase indicator -->
        <div id="blend-indicator">
            <div class="bar"><div class="fill" id="blend-fill"></div></div>
            <div class="pcts">
                <span id="blend-pct-left">0%</span>
                <span id="blend-pct-right">100%</span>
            </div>
            <div class="lbls">
                <span><span class="dot"></span><span id="blend-lbl-left">EBB</span></span>
                <span><span id="blend-lbl-right">LOW</span><span class="dot"></span></span>
            </div>
        </div>

        <!-- Right-side vertical slider with tide markers (visible once a map is picked). -->
        <div id="slider-wrap">
            <div class="slider-title" id="slider-top-label">+12h</div>
            <div class="slider-body">
                <div class="tide-markers-col" id="tide-markers"></div>
                <div class="slider-track-area">
                    <input type="range" id="vert-slider"
                           min="0" max="43200" step="1" value="0" orient="vertical">
                </div>
            </div>
            <div id="vert-slider-readout">+0:00:00</div>
        </div>

    </main>

    <aside id="sidebar">
        <!-- Maps: 2 columns of 7 -->
        <div class="section map-section">
            <div class="section-header with-arrow">
                <button id="collapse-sidebar" title="Hide menu">&#9664;</button>
                Map
            </div>
            <div class="map-grid">
                <div class="col">
                    <button class="btn map-btn" data-map="Auckland">Auckland</button>
                    <button class="btn map-btn" data-map="Wight">Isle of Wight</button>
                    <button class="btn map-btn" data-map="LaTrinite">La Trinité</button>
                    <button class="btn map-btn" data-map="Malmo">Malmö</button>
                    <button class="btn map-btn" data-map="Marseille">Marseille</button>
                    <button class="btn map-btn" data-map="Napoli">Napoli</button>
                    <button class="btn map-btn" data-map="PortoCervo">Porto Cervo</button>
                </div>
                <div class="col">
                    <button class="btn map-btn" data-map="QingDao">Qing Dao</button>
                    <button class="btn map-btn" data-map="Rio">Rio de Janeiro</button>
                    <button class="btn map-btn" data-map="SanFrancisco">San Francisco</button>
                    <button class="btn map-btn" data-map="Sydney">Sydney</button>
                    <button class="btn map-btn" data-map="Trapani">Trapani</button>
                    <button class="btn map-btn" data-map="Valencia">Valencia</button>
                    <button class="btn map-btn" data-map="Vancouver">Vancouver</button>
                </div>
            </div>
        </div>

        <!-- Wind direction (radio).  The bottom-left toggle handles on/off. -->
        <div class="section">
            <div class="section-header">Wind direction</div>
            <div class="wind-grid">
                <button class="btn wind-btn" data-wind="north">N</button>
                <button class="btn wind-btn" data-wind="north_east">NE</button>
                <button class="btn wind-btn" data-wind="east">E</button>
                <button class="btn wind-btn" data-wind="south_east">SE</button>
                <button class="btn wind-btn" data-wind="south">S</button>
                <button class="btn wind-btn" data-wind="south_west">SW</button>
                <button class="btn wind-btn" data-wind="west">W</button>
                <button class="btn wind-btn" data-wind="north_west">NW</button>
            </div>
        </div>

        <div class="radio-panel" id="windforce-panel">
            <span class="label">Wind strength</span>
            <div class="radio-buttons">
                <button class="radio-btn windforce-btn" data-force="F3">F3</button>
                <button class="radio-btn windforce-btn" data-force="F4">F4</button>
                <button class="radio-btn windforce-btn active" data-force="F5">F5</button>
                <button class="radio-btn windforce-btn" data-force="F6">F6</button>
                <button class="radio-btn windforce-btn" data-force="F7">F7</button>
            </div>
        </div>

        <div class="radio-panel" id="prestart-panel">
            <span class="label">Prestart</span>
            <div class="radio-buttons">
                <button class="radio-btn prestart-btn" data-pre="0">0</button>
                <button class="radio-btn prestart-btn" data-pre="1">1</button>
                <button class="radio-btn prestart-btn active" data-pre="3">3</button>
                <button class="radio-btn prestart-btn" data-pre="5">5</button>
                <button class="radio-btn prestart-btn" data-pre="8">8</button>
            </div>
        </div>

        <div id="time-panel">
            <div class="time-row">
                <label for="start-time">Race start</label>
                <input type="text" class="time-text" id="start-time"
                       value="12:00:00" maxlength="8"
                       inputmode="numeric" placeholder="HH:MM:SS">
            </div>
            <div class="time-row">
                <label for="high-tide-time">High tide</label>
                <input type="text" class="time-text" id="high-tide-time"
                       value="18:00:00" maxlength="8"
                       inputmode="numeric" placeholder="HH:MM:SS">
            </div>
            <div class="step-row">
                <button class="step-btn" id="step-minus">&minus;5 min</button>
                <button class="step-btn" id="step-reset">Reset</button>
                <button class="step-btn" id="step-plus">+5 min</button>
            </div>
        </div>
    </aside>

</div>

<script src="app.js"></script>
</body>
</html>
